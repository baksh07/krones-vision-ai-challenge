[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krones-vision-ai"
version = "0.1.0"
description = "Computer-vision experiments for the Krones Vision AI Challenge"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
vision = [
    "albumentations>=1.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pycocotools>=2.0",
    "scikit-learn>=1.3",
    "segmentation-models-pytorch>=0.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",
]
test = ["pytest>=7.4"]

[project.scripts]
krones-vision-ai = "krones_vision_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
